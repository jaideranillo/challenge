# local profile - local development and live demo use only.
# Timings below (challenge.retry.backoff, challenge.relay.poll-interval)
# deliberately diverge from the production schedules in ADR-004 SS1
# (retry backoff) and ADR-002 (relay poll interval) so a full
# retry cycle fits inside a live demo. The production numbers in those
# ADRs remain authoritative; do not read these compressed values as real.

challenge:
  sqs:
    endpoint: http://localhost:4566
    region: us-east-1
    credentials:
      access-key: test
      secret-key: test
    queues:
      deliveries: deliveries
      deliveries-dlq: deliveries-dlq
  retry:
    backoff: 2s, 5s, 10s
  relay:
    poll-interval: 2s
